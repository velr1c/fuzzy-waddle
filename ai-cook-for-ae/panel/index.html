<!doctype html>
<html><head><meta charset="utf-8"><title>AI Cook</title><script src="./CSInterface.js"></script><style>body{font:13px Arial;background:#20242c;color:#eef;padding:14px}textarea,input,select,button{width:100%;box-sizing:border-box;margin:6px 0;padding:8px;border-radius:4px;border:1px solid #596273;background:#303746;color:#fff}button{background:#39a88e;border:0;font-weight:bold;cursor:pointer}#apply{background:#5267c8}.status{padding:8px;background:#171a20;margin:8px 0}.log{white-space:pre-wrap;background:#171a20;padding:8px;min-height:90px;font-size:11px}</style></head><body><h2>AI Cook</h2><label>Prompt</label><textarea id="prompt" rows="5">30 second title sequence about the Fermi Paradox</textarea><label>Seconds</label><input id="seconds" type="number" min="3" max="300" value="30"><label>Style</label><select id="style"><option value="auto">auto</option><option value="dark_sci_fi">dark_sci_fi</option><option value="neon">neon</option><option value="warm_documentary">warm_documentary</option><option value="minimal">minimal</option></select><div class="status" id="status">Checking kitchen…</div><button id="cook">COOK</button><button id="apply" disabled>APPLY TO AE</button><div class="log" id="log"></div><script>var planPath=null,plan=null,cs=window.CSInterface?new CSInterface():null;function log(x){document.getElementById('log').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function status(x){document.getElementById('status').textContent=x}fetch('http://127.0.0.1:8765/status').then(function(r){return r.json()}).then(function(x){status('Kitchen connected');log(x)}).catch(function(){status('Kitchen unavailable — start kitchen.py')});document.getElementById('cook').onclick=function(){status('Cooking…');fetch('http://127.0.0.1:8765/cook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.getElementById('prompt').value,seconds:Number(document.getElementById('seconds').value),style:document.getElementById('style').value})}).then(function(r){return r.json()}).then(function(x){if(x.error)throw Error(x.error);plan=x.plan;planPath=x.plan_path;status('Plan ready');log(x.report);document.getElementById('apply').disabled=false}).catch(function(e){status('Cook failed');log(String(e))})};document.getElementById('apply').onclick=function(){if(!planPath)return;var warning=plan&&plan.audio&&plan.audio.status==='MISSING'?'\nWarning: narration/audio is MISSING; the comp will be silent.':'';if(warning)status('Applying with missing audio');if(cs){cs.evalScript('aiCookApply('+JSON.stringify(planPath)+')',function(result){log(result)})}else{log('After Effects CEP runtime unavailable. Plan: '+planPath)}};</script></body></html>
